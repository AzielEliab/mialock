[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mialock"
version = "0.1.1"
description = "M.I.A.Lock: purpose-bound missing-person event map, Doe descriptor matching, uncertainty ellipses, and coverage-heat layers. Historical pins only. Doe leads ≠ ID. (Aziel Eliab, 2026)."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Aziel Eliab"}]
requires-python = ">=3.10"
keywords = [
    "missing-person",
    "investigation",
    "event-map",
    "cold-case",
    "archives",
    "provenance",
    "mialock",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Intended Audience :: Science/Research",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
mialock = "mialock.cli:main"

[project.urls]
Homepage = "https://github.com/AzielEliab/mialock"
Download = "https://mialock-download-tracker.vibelock.workers.dev/download?asset=mialock-0.1.1.tar.gz"
Issues = "https://github.com/AzielEliab/mialock/issues"
Counted-downloads = "https://mialock-download-tracker.vibelock.workers.dev/"
Catalog = "https://aziel-runtime.vibelock.workers.dev/p/mialock/"
Tether = "https://azieltether-download-tracker.vibelock.workers.dev/"

[tool.setuptools.packages.find]
include = ["mialock*"]

[tool.setuptools.package-data]
mialock = ["data/*.json", "static/*", "static/images/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
